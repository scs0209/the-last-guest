# Render Blueprint: a free static site. No model runs on Render.
# - Suggested questions use answers Gemma 4 E4B wrote in advance (web/gen/answer_cache.json).
# - Typed questions run Gemma 4 E2B in the player's own browser (WebGPU), through the same
#   guardrail ported to JavaScript (web/harness.js, data exported by build_web.py).
# To serve Gemma from a server instead, see Dockerfile (needs a paid plan with more than 8 GB of RAM).
services:
  - type: web
    name: the-last-guest
    runtime: static
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: web
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
