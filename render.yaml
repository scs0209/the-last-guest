# Render Blueprint: one Docker web service running the game server and Gemma on CPU.
# Measured locally: the container holds about 7.1 GB with Gemma 4 E4B (Q4_K_M) loaded, so an
# 8 GB plan leaves almost no headroom. Pick a plan with more memory and confirm it against
# your credits before deploying.
services:
  - type: web
    name: the-last-guest
    runtime: docker
    plan: pro plus
    healthCheckPath: /healthz
    envVars:
      - key: LIVE_PER_IP
        value: "30"
      - key: LIVE_QUEUE
        value: "4"
