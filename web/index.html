<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Last Guest</title>
<meta name="description" content="A Día de los Muertos ghost story. Four objects in a forgotten house each remember a piece of her, through an open-weight model kept honest by code.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="scene"></canvas>

<!-- HUD -->
<div class="hud hidden" id="hud">
  <div class="pill"><span class="icon">✦</span><span data-t="hud.clues"></span> <b id="clueCount">0/4</b></div>
  <div class="room" id="roomName"></div>
  <canvas class="minimap" id="minimap" width="300" height="300" aria-hidden="true"></canvas>
  <div class="candles" id="candles" aria-label="candles"></div>
  <div class="crosshair" id="crosshair"></div>
  <div class="prompt hidden" id="prompt"><span class="key">E</span><span id="promptVerb"></span><span class="what" id="promptWhat"></span></div>
  <div class="click-hint hidden" id="clickHint" data-t="hud.clickToLook"></div>
  <div class="controls" id="controls"></div>
  <div class="dock"><button class="btn" id="journalBtn"><span data-t="hud.memories"></span> <span class="key">J</span></button></div>
  <div class="toast" id="toast"></div>
  <div class="clue-card" id="clueCard"><div class="k" data-t="clueFound"></div><h3 id="clueName"></h3><p id="clueText"></p></div>
  <div class="joy hidden" id="joy"><i></i></div>
  <button class="touch-act hidden" id="touchAct" data-t="hud.investigate"></button>
</div>

<!-- dialogue with an object -->
<section class="talk hidden" id="talk" aria-live="polite">
  <div class="talk-art">
    <canvas id="objArt" width="640" height="640"></canvas>
    <div class="wave hidden" id="wave"><div class="k" id="waveTitle"></div><canvas id="waveCanvas" width="600" height="80"></canvas><div class="bar"><i id="waveBar"></i></div></div>
  </div>
  <div class="talk-panel">
    <div class="talk-head">
      <div><h2 id="who"></h2><div class="sub" id="whoSub"></div><p class="desc" id="whoDesc"></p></div>
      <button class="x" id="closeTalk"><span data-t="ask.back"></span> · Esc</button>
    </div>
    <div class="log" id="log"></div>
    <div class="gemma hidden" id="gemmaBar"></div>
    <div class="ask-k" data-t="ask.prompt"></div>
    <div class="chips" id="chips"></div>
    <form class="ask" id="askForm"><input id="q" autocomplete="off" maxlength="300"><button class="btn gold" data-t="ask.send"></button></form>
  </div>
</section>

<!-- journal -->
<div class="overlay hidden" id="journal"><div class="card journal">
  <h2 data-t="journal.title"></h2><p class="small" data-t="journal.sub"></p>
  <div class="small" data-t="journal.found"></div>
  <div class="objs" id="journalObjs"></div>
  <div id="journalGoals"></div>
  <div class="row"><button class="btn" id="closeJournal" data-t="journal.close"></button><button class="btn marigold" id="restoreBtn" data-t="journal.restore"></button></div>
</div></div>

<!-- ofrenda -->
<div class="overlay hidden" id="ofrenda"><div class="card">
  <h2 data-t="ofrenda.title"></h2><p class="lead" data-t="ofrenda.desc"></p>
  <div id="slots"></div><div class="feedback" id="feedback"></div>
  <div class="row"><button class="btn" id="closeOfrenda" data-t="ofrenda.notYet"></button><button class="btn marigold" id="lightBtn" data-t="ofrenda.light"></button></div>
</div></div>

<!-- endings -->
<section class="ending hidden" id="ending">
  <canvas id="portrait" width="640" height="800"></canvas>
  <div><p class="name" id="endName"></p><div class="dates" id="endDates"></div><div id="endLines"></div></div>
</section>
<div class="overlay hidden" id="forgotten"><div class="card forgotten" id="forgottenCard"></div></div>

<!-- story intro -->
<div class="overlay hidden" id="intro"><div class="card intro"><div id="introLines"></div><div class="row"><button class="btn gold" id="enterBtn" data-t="intro.enter"></button></div></div></div>

<!-- pause -->
<div class="overlay hidden" id="pause"><div class="card" style="width:min(360px,100%)">
  <h2 data-t="title"></h2>
  <div class="menu-list" style="margin-top:12px">
    <button class="menu-item primary" id="resumeBtn" data-t="menu.resume"></button>
    <button class="menu-item" data-open="settings" data-t="menu.settings"></button>
    <button class="menu-item" data-open="about" data-t="menu.about"></button>
    <button class="menu-item" id="toMenuBtn" data-t="menu.toMenu"></button>
  </div>
</div></div>

<!-- settings -->
<div class="overlay hidden" id="settings"><div class="card">
  <h2 data-t="settings.title"></h2>
  <div class="setting"><span data-t="settings.language"></span><div class="seg" data-setting="lang"><button data-v="ko">한국어</button><button data-v="en">English</button></div></div>
  <div class="setting"><span data-t="settings.sound"></span><div class="seg" data-setting="sound"><button data-v="on" data-t="settings.on"></button><button data-v="off" data-t="settings.off"></button></div></div>
  <div class="setting"><span data-t="settings.sensitivity"></span><input type="range" id="sens" min="0.4" max="2" step="0.1"></div>
  <div class="row"><button class="btn" data-close="settings" data-t="settings.close"></button></div>
</div></div>

<!-- about the AI -->
<div class="overlay hidden" id="about"><div class="card about" style="width:min(680px,100%)">
  <h2 data-t="about.title"></h2>
  <p class="lead" data-t="about.lead"></p>
  <ul id="aboutPoints"></ul>
  <div class="small" data-t="about.tableTitle"></div>
  <table id="aboutTable"></table>
  <p class="small" data-t="about.note"></p>
  <div class="row"><button class="btn" data-close="about" data-t="about.close"></button></div>
</div></div>

<!-- main menu -->
<section id="menu">
  <canvas id="titleArt"></canvas>
  <div class="lang-switch" data-setting="lang"><button data-v="ko">한국어</button><button data-v="en">EN</button></div>
  <div class="menu-inner">
    <h1 class="title" data-t="title"></h1>
    <div class="tagline" data-t="tagline"></div>
    <div class="menu-list">
      <button class="menu-item primary" id="newGameBtn" data-t="menu.new"></button>
      <button class="menu-item" data-open="settings" data-t="menu.settings"></button>
      <button class="menu-item" data-open="about" data-t="menu.about"></button>
    </div>
  </div>
  <div class="menu-foot">Gemma 4 E4B · open-weight · Hacktoberfest 2026 “Ghost in the Machine”</div>
</section>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
